<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jealousy</title>
    <link
      rel="stylesheet"
      href="./assets/plugins/swiper/swiper-bundle.min.css"
    />
    <link rel="stylesheet" href="./assets/css/style.css" />
    <link rel="stylesheet" href="./assets/css/index.css" />
    <script src="./assets/js/index-init.js"></script>
    <link rel="prefetch" href="./define.html" />
    <link rel="prefetch" href="./when.html" />
    <link rel="prefetch" href="./adverse.html" />
    <link rel="prefetch" href="./how.html" />
    <link rel="prefetch" href="./assets/images/room-scene.png" as="image" />
    <link rel="prefetch" href="./assets/images/bginside.png" as="image" />
    <link rel="prefetch" href="./assets/images/window-frame.png" as="image" />
    <link rel="prefetch" href="./assets/images/leftwindow.png" as="image" />
    <link rel="prefetch" href="./assets/images/rightwindow.png" as="image" />
  </head>

  <body id="body">
    <div id="langSelect">
      <div id="language">
        <label
          ><input
            type="radio"
            onclick="val('English')"
            name="lang"
            id="en"
            value="English"
          />
          <span>E</span>
        </label>
        <label
          ><input
            type="radio"
            onclick="val('Hindi')"
            name="lang"
            id="hi"
            value="Hindi"
          />
          <span>H</span>
        </label>
        <label
          ><input
            type="radio"
            onclick="val('Gujrati')"
            name="lang"
            id="gu"
            value="Gujrati"
          />
          <span>G</span>
        </label>
      </div>
    </div>

    <img class="page-bg" src="./assets/images/background.png" alt="" />

    <div class="main-container">
      <div class="stage state-intro" id="stage">
        <img
          class="stage-spacer"
          src="./assets/images/stage-spacer.png"
          alt=""
        />

        <div class="world" id="world">
          <img
            class="world-spacer"
            src="./assets/images/stage-spacer.png"
            alt=""
          />
          <img
            class="classroom-bg"
            src="./assets/images/bg.png"
            alt="Classroom"
          />
          <div class="student boy-left">
            <img
              class="student-shadow"
              src="./assets/images/shadow.png"
              alt=""
            />
            <img
              class="student-face"
              src="./assets/images/thirdboyleft.png"
              alt="What is Jealousy ? face"
            />
            <img
              class="student-body"
              src="./assets/images/thirdboyleft1.png"
              alt="What is Jealousy ? desk"
            />
            <p class="student-note">
              <span class="english">What is<br />Jealousy ?</span
              ><span class="hindi">What is<br />Jealousy ?</span
              ><span class="gujrati">What is<br />Jealousy ?</span>
            </p>
          </div>
          <div class="student girl-left">
            <img
              class="student-shadow"
              src="./assets/images/shadow.png"
              alt=""
            />
            <img
              class="student-face"
              src="./assets/images/secondleftgirl.png"
              alt="When are we Jealous ? face"
            />
            <img
              class="student-body"
              src="./assets/images/secondleftgirl1.png"
              alt="When are we Jealous ? desk"
            />
            <p class="student-note">
              <span class="english">When are we<br />Jealous ?</span
              ><span class="hindi">When are we<br />Jealous ?</span
              ><span class="gujrati">When are we<br />Jealous ?</span>
            </p>
          </div>
          <div class="student boy-right">
            <img
              class="student-shadow"
              src="./assets/images/shadow.png"
              alt=""
            />
            <img
              class="student-face"
              src="./assets/images/secondboyright.png"
              alt="Adverse effects of Jealousy face"
            />
            <img
              class="student-body"
              src="./assets/images/secondboyright1.png"
              alt="Adverse effects of Jealousy desk"
            />
            <p class="student-note">
              <span class="english">Adverse effects<br />of Jealousy</span
              ><span class="hindi">Adverse effects<br />of Jealousy</span
              ><span class="gujrati">Adverse effects<br />of Jealousy</span>
            </p>
          </div>
          <div class="student girl-right">
            <img
              class="student-shadow"
              src="./assets/images/shadow.png"
              alt=""
            />
            <img
              class="student-face"
              src="./assets/images/thirdgirlright.png"
              alt="How to handle Jealousy? face"
            />
            <img
              class="student-body"
              src="./assets/images/thirdgirlright1.png"
              alt="How to handle Jealousy? desk"
            />
            <p class="student-note">
              <span class="english">How to handle<br />Jealousy?</span
              ><span class="hindi">How to handle<br />Jealousy?</span
              ><span class="gujrati">How to handle<br />Jealousy?</span>
            </p>
          </div>
          <div class="student girl-center">
            <img
              class="student-shadow"
              src="./assets/images/shadow.png"
              alt=""
            />
            <img
              class="girl-body"
              src="./assets/images/centergirlbody.png"
              alt="Angry girl sitting at her desk"
            />
            <img
              class="girl-face girl-straight"
              src="./assets/images/centergirl.png"
              alt="Angry girl looking ahead"
            />
            <img
              class="girl-face girl-eyes-1"
              src="./assets/images/centergirl1.png"
              alt="Angry girl looking at the first student"
            />
            <img
              class="girl-face girl-eyes-2"
              src="./assets/images/centergirl2.png"
              alt="Angry girl looking at the second student"
            />
            <img
              class="girl-face girl-eyes-3"
              src="./assets/images/centergirl3.png"
              alt="Angry girl looking at the third student"
            />
            <img
              class="girl-face girl-eyes-4"
              src="./assets/images/centergirl4.png"
              alt="Angry girl looking at the fourth student"
            />
          </div>
        </div>

        <div class="exit-layer" id="exitLayer">
          <img class="exit-tint" src="./assets/images/glass-tint.png" alt="" />
          <img class="exit-room" src="./assets/images/room-scene.png" alt="" />
          <img class="exit-wall" src="./assets/images/bginside.png" alt="" />
          <img
            class="exit-frame"
            src="./assets/images/window-frame.png"
            alt=""
          />
          <img
            class="exit-shutter exit-shutter-left"
            src="./assets/images/leftwindow.png"
            alt=""
          />
          <img
            class="exit-shutter exit-shutter-right"
            src="./assets/images/rightwindow.png"
            alt=""
          />
        </div>

        <div class="title-wrap">
          <img class="title-burst" src="./assets/images/title.png" alt="" />
          <h1 class="title-text">
            <span class="english">Jealousy</span
            ><span class="hindi">ईर्ष्या</span
            ><span class="gujrati">ઈર્ષ્યા</span>
          </h1>
        </div>

        <a class="back-btn" href="#" aria-label="Back"
          ><img src="./assets/images/replay.png" alt="Back"
        /></a>

        <button class="enter-btn" id="enterBtn" type="button">
          <span class="english">ENTER</span
          ><span class="hindi">प्रवेश करें</span
          ><span class="gujrati">પ્રવેશ કરો</span>
        </button>
        <img class="enter-emoji" src="./assets/images/emoji.png" alt="" />
      </div>
    </div>

    <script src="./assets/plugins/swiper/swiper-bundle.min.js"></script>
    <script src="./assets/js/jquery-3.7.1.js"></script>
    <script src="./assets/js/data.js"></script>
    <script src="./assets/js/custom.js"></script>
    <script src="./assets/js/index.js"></script>
  </body>
</html>
